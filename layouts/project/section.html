{{ define "main" }}
  <section class="page-head">
    <div class="wrap">
      <p class="eyebrow">{{ len .Pages }} projects</p>
      <h1>{{ .Title }}</h1>
      {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="grid-3">
        {{ range .Pages.ByDate.Reverse }}
          {{ partial "card/project.html" . }}
        {{ else }}
          <p class="mono">No projects yet.</p>
        {{ end }}
      </div>
    </div>
  </section>
{{ end }}
