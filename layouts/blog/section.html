{{ define "main" }}
  <section class="page-head">
    <div class="wrap">
      <p class="eyebrow">{{ len .Pages }} posts</p>
      <h1>{{ .Title }}</h1>
      {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      {{ partial "post-timeline.html" .Pages.ByDate.Reverse }}
    </div>
  </section>
{{ end }}
