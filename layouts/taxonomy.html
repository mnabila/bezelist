{{ define "main" }}
  <section class="page-head">
    <div class="wrap">
      <p class="eyebrow">{{ len .Pages }} tags</p>
      <h1>{{ .Title }}</h1>
    </div>
  </section>
  <section class="section">
    <div class="wrap tag-row">
      {{ range .Pages }}
        <a class="tag" href="{{ .RelPermalink }}" style="font-size: 0.95rem; padding: 0.4rem 0.8rem;">{{ .LinkTitle }} ({{ len .Pages }})</a>
      {{ end }}
    </div>
  </section>
{{ end }}
