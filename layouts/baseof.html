<!DOCTYPE html>
<html lang="{{ or site.Language.Locale `en` }}" dir="{{ or site.Language.Direction `ltr` }}" data-theme="light">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ partialCached "head/js.html" . }}
</body>
</html>
