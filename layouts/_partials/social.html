{{- /* Renders social icon links from site.Params.social. */}}
{{- with site.Params.social }}
  <div class="flex gap-[0.6rem] mt-2">
    {{ range . }}
      <a class="social-link" href="{{ .url }}" aria-label="{{ .name | default .platform }}" rel="me noopener" target="_blank">
        <i class="{{ .icon }}"></i>
      </a>
    {{ end }}
  </div>
{{- end }}
