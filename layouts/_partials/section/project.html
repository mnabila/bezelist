{{ with site.GetPage "project" }}
  {{ $pages := sort .Pages "Params.date" "desc" }}
  <section id="project" class="section">
    <div class="wrap">
      <div class="section-head">
        <h2>Projects</h2>
        <span class="eyebrow">{{ site.Params.sections.project }}</span>
      </div>
<div class="grid grid-cols-1 gap-8 md:grid-cols-3">
        {{ range first 6 $pages }}
          {{ partial "card/project.html" . }}
        {{ end }}
      </div>
      {{ if gt (len $pages) 6 }}
        <div class="section-more">
          <a class="btn btn-primary" href="{{ .RelPermalink }}">See more projects <i class="fa-solid fa-arrow-right"></i></a>
        </div>
      {{ end }}
    </div>
  </section>
{{ end }}
