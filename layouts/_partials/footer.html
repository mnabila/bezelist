<footer class="bg-surface border-t-[3px] border-ink">
  <div class="wrap grid grid-cols-1 md:grid-cols-3 gap-8 py-[clamp(2.5rem,5vw,3.5rem)]">
    <div class="md:col-span-1">
      <a class="inline-flex items-center gap-[0.7rem] text-ink mb-[0.9rem]" href="{{ "/" | relURL }}">
        {{ partial "badge.html" . }}
        <span class="font-display font-black text-[1.1rem] uppercase tracking-[-0.01em]">{{ site.Title }}</span>
      </a>
      <p class="text-muted text-[0.95rem] max-w-[34ch]">{{ or site.Params.author.tagline "" }}</p>
      {{ partial "social.html" . }}
    </div>

    <div class="md:col-span-1">
      <h4 class="font-mono text-[0.75rem] font-bold tracking-[0.12em] uppercase mb-[0.9rem]">Navigate</h4>
      <ul class="list-none m-0 p-0">
        {{- range site.Menus.main }}
          <li class="mb-[0.55rem]"><a class="text-[0.95rem] border-b-2 border-transparent hover:border-accent hover:text-accent" href="{{ .URL }}">{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </div>

    <div class="md:col-span-1">
      <h4 class="font-mono text-[0.75rem] font-bold tracking-[0.12em] uppercase mb-[0.9rem]">Elsewhere</h4>
      <ul class="list-none m-0 p-0">
        {{- range site.Params.social }}
          <li class="mb-[0.55rem]">
            <a class="text-[0.95rem] border-b-2 border-transparent hover:border-accent hover:text-accent" href="{{ .url }}" rel="me noopener" target="_blank">{{ .name }}</a>
          </li>
        {{- end }}
      </ul>
    </div>
  </div>
</footer>
